name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check browser and API syntax
        run: |
          node --check app.js
          node --check api/infer.js
          node --check api/status.js
      - name: Run deterministic tests
        run: npm test
